name: Android Prerelease

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Use public Gradle distribution on GitHub runner
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties
      - name: Build installable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Prepare release asset
        shell: bash
        run: |
          release_apk="ai-api-dashboard-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-api-dashboard-${{ github.ref_name }}-debug
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RELEASE_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AI API Dashboard $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Public prerelease debug APK built by GitHub Actions from commit $GITHUB_SHA. This is not a production-signed store release."
