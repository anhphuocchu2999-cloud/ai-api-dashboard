name: Android Prerelease

on:
  push:
    branches:
      - feature/stage-8b-simple-connection-flow
    tags:
      - 'v*-beta.*'
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'tools/ci-emulator-gate.sh'
      - '.github/workflows/android-prerelease.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prerelease tag to publish
        required: true
        default: v0.1.0-beta.16

concurrency:
  group: android-prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      EXPECTED_SIGNING_CERT_SHA256: A8F816B106F23274F35E3DDC8B19C464A31F7A7BD0871E3294AA6E6922954860
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Use public Gradle distribution on GitHub runner
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties
      - name: Require stable beta signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          signing_store_file="$RUNNER_TEMP/ai-api-dashboard-beta.p12"
          echo "ANDROID_SIGNING_STORE_FILE=$signing_store_file" >> "$GITHUB_ENV"
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_store_file"
      - name: Test and build installable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash tools/ci-emulator-gate.sh
      - name: Verify stable signing certificate
        shell: bash
        run: |
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          certificate_output="$($apksigner_path verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          actual_digest="$(printf '%s\n' "$certificate_output" \
            | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' \
            | head -n 1 \
            | tr -d '[:space:]:' \
            | tr '[:lower:]' '[:upper:]')"
          expected_digest="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          test -n "$actual_digest"
          echo "APK signing certificate SHA-256: $actual_digest"
          test "$actual_digest" = "$expected_digest"
      - name: Prepare release asset
        shell: bash
        run: |
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" == "refs/heads/feature/stage-8b-simple-connection-flow" ]]; then
            release_tag="${{ inputs.release_tag || 'v0.1.0-beta.16' }}"
          fi
          release_apk="ai-api-dashboard-${release_tag}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$release_apk"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-api-dashboard-${{ env.RELEASE_TAG }}-debug
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/feature/stage-8b-simple-connection-flow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AI API Dashboard $RELEASE_TAG" \
            --prerelease \
            --notes "Public prerelease debug APK built by GitHub Actions from commit $GITHUB_SHA and signed with the stable Beta certificate $EXPECTED_SIGNING_CERT_SHA256. This is not a production-signed store release."
      - name: Remove reconstructed signing file
        if: always()
        run: rm -f "$ANDROID_SIGNING_STORE_FILE"
