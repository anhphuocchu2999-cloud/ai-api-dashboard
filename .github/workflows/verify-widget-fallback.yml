name: Verify widget fallback build

on:
  push:
    branches:
      - feature/persistent-widget-fallback
    paths:
      - '.github/workflows/verify-widget-fallback.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/persistent-widget-fallback
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK once
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Record successful verification
        run: |
          printf 'Widget fallback assembleDebug succeeded on %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > WIDGET_FALLBACK_BUILD_OK.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WIDGET_FALLBACK_BUILD_OK.txt
          git commit -m "Record successful widget fallback build"
          git push origin feature/persistent-widget-fallback
