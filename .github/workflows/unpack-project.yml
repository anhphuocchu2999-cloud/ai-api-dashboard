name: Unpack uploaded project

on:
  push:
    branches:
      - work/project-import
    paths:
      - '.github/workflows/unpack-project.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/project-import
      - name: Unpack project archive
        run: |
          unzip -o ai-api-dashboard-project.zip
      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unpack uploaded Android project"
            git push origin work/project-import
          fi
