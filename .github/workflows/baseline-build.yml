name: Baseline Android Build

on:
  push:
    branches:
      - work/project-import
    paths:
      - '.github/workflows/baseline-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/project-import
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Record successful baseline build
        run: |
          printf 'Baseline assembleDebug succeeded on %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BASELINE_BUILD_OK.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BASELINE_BUILD_OK.txt
          git commit -m "Record successful baseline Android build"
          git push origin work/project-import
