name: Apply verified widget fallback from PR

on:
  pull_request_target:
    branches:
      - ci/stage-6-2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/persistent-widget-fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/persistent-widget-fallback
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply focused fallback changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          widget_path = Path('app/src/main/java/com/java/myapplication/adapter/WidgetData.kt')
          widget = widget_path.read_text()
          old = '''    val cumulativeUsageActualCost: String? = null    // 累计消费金额（字符串避免浮点误差）
          )'''
          new = '''    val cumulativeUsageActualCost: String? = null,   // 累计消费金额（字符串避免浮点误差）
              val isFallback: Boolean = false                  // 是否正在显示上次成功数据
          )'''
          if old not in widget:
              raise SystemExit('WidgetData insertion point not found')
          widget_path.write_text(widget.replace(old, new, 1))

          provider_path = Path('app/src/main/java/com/java/myapplication/BalanceWidgetProvider.kt')
          provider = provider_path.read_text()

          auxiliary_block = '''            val auxiliaryId = when (prefix) {
                          "kimi" -> R.id.kimi_auxiliary
                          "mimo" -> R.id.mimo_auxiliary
                          "ds" -> R.id.ds_auxiliary
                          "oai" -> R.id.oai_auxiliary
                          else -> R.id.kimi_auxiliary
                      }
          '''
          fallback_block = auxiliary_block + '''            val fallbackId = when (prefix) {
                          "kimi" -> R.id.kimi_fallback
                          "mimo" -> R.id.mimo_fallback
                          "ds" -> R.id.ds_fallback
                          "oai" -> R.id.oai_fallback
                          else -> R.id.kimi_fallback
                      }
          '''
          if auxiliary_block not in provider:
              raise SystemExit('Provider auxiliaryId block not found')
          provider = provider.replace(auxiliary_block, fallback_block, 1)

          log_line = '''            android.util.Log.d("BalanceWidgetProvider", "prefix=$prefix, usageMetrics.size=${data.usageMetrics.size}, usageMetrics.first=${data.usageMetrics.firstOrNull()?.label ?: "null"}")
          '''
          marker_lines = log_line + '''
                      views.setTextViewText(fallbackId, if (data.isFallback) "😂" else "")
                      views.setViewVisibility(
                          fallbackId,
                          if (data.isFallback) android.view.View.VISIBLE else android.view.View.GONE
                      )
          '''
          if log_line not in provider:
              raise SystemExit('Provider render marker insertion point not found')
          provider = provider.replace(log_line, marker_lines, 1)

          old_core2 = '''            val core2Text: String
                      val hasRealData = data.usageMetrics.isNotEmpty()
                      if (hasRealData) {
                          // 真实数据：按索引轮播
                          val idx = carouselIndex % data.usageMetrics.size
                          val metric = data.usageMetrics[idx]
                          core2Text = "${metric.label} ${metric.value}"
                      } else {
                          // 无真实数据：等待态轮播（MiMo / DeepSeek）
                          val idx = carouselIndex % waitingMessages.size
                          core2Text = waitingMessages[idx]
                      }
          '''
          new_core2 = '''            val core2Text: String
                      val hasRealData = data.usageMetrics.isNotEmpty()
                      if (data.isFallback) {
                          core2Text = FALLBACK_MESSAGE
                      } else if (hasRealData) {
                          // 真实数据：按索引轮播
                          val idx = carouselIndex % data.usageMetrics.size
                          val metric = data.usageMetrics[idx]
                          core2Text = "${metric.label} ${metric.value}"
                      } else {
                          // 无真实数据：等待态轮播（MiMo / DeepSeek）
                          val idx = carouselIndex % waitingMessages.size
                          core2Text = waitingMessages[idx]
                      }
          '''
          if old_core2 not in provider:
              raise SystemExit('Provider Core 2 block not found')
          provider = provider.replace(old_core2, new_core2, 1)

          old_cache = '''        // 缓存上次成功数据，避免短暂错误覆盖有效数据
                  private val cachedData = mutableMapOf<String, WidgetData>()
                  private val lastSuccessTime = mutableMapOf<String, Long>()
                  private const val CACHE_VALID_MS = 60000L // 缓存有效期 60 秒
          '''
          new_cache = '''        // 缓存上次成功数据，避免短暂错误覆盖有效数据
                  private val cachedData = mutableMapOf<String, WidgetData>()
                  private val lastSuccessTime = mutableMapOf<String, Long>()
                  private const val CACHE_VALID_MS = 60000L // 旧内存缓存兼容窗口
                  private const val CACHE_PREFS_NAME = "widget_last_success"
                  private const val FALLBACK_MESSAGE = "网络有点抖，先看上次数据～"
          '''
          if old_cache not in provider:
              raise SystemExit('Provider cache declaration block not found')
          provider = provider.replace(old_cache, new_cache, 1)

          old_result = '''            // 如果请求成功，更新缓存
                      if (processedResult.isAvailable && !processedResult.isEmpty()) {
                          cachedData[platformName] = processedResult
                          lastSuccessTime[platformName] = System.currentTimeMillis()
                          return processedResult
                      }
          
                      // 如果请求失败但缓存有效，返回缓存数据
                      val cached = cachedData[platformName]
                      val lastTime = lastSuccessTime[platformName] ?: 0L
                      val cacheAge = System.currentTimeMillis() - lastTime
                      
                      if (cached != null && cached.isAvailable && cacheAge < CACHE_VALID_MS) {
                          // 返回缓存数据，但标记为"稍后刷新"
                          return cached.copy(
                              modelName = cached.modelName?.let { "$it (稍后刷新)" } ?: "稍后刷新"
                          )
                      }
          
                      // 没有有效缓存，返回错误
                      return processedResult
          '''
          new_result = '''            // 请求成功：同时更新内存缓存和持久化的最近一次成功数据
                      if (processedResult.isSuccess && processedResult.isAvailable && !processedResult.isEmpty()) {
                          cachedData[platformName] = processedResult
                          lastSuccessTime[platformName] = System.currentTimeMillis()
                          persistWidgetData(context, platformName, processedResult)
                          return processedResult
                      }
          
                      // 仅对临时网络类失败启用兜底；认证失败、配置错误等仍显示真实错误
                      if (isTransientFailure(processedResult)) {
                          val cached = cachedData[platformName]
                              ?: loadPersistedWidgetData(context, platformName)
                          if (cached != null && cached.isAvailable && !cached.isEmpty()) {
                              cachedData[platformName] = cached
                              return cached.copy(
                                  usageMetrics = listOf(WidgetData.DisplayMetric("", FALLBACK_MESSAGE)),
                                  statusText = FALLBACK_MESSAGE,
                                  isSuccess = true,
                                  isAvailable = true,
                                  errorMessage = processedResult.errorMessage,
                                  isFallback = true
                              )
                          }
                      }
          
                      return processedResult
          '''
          if old_result not in provider:
              raise SystemExit('Provider result cache block not found')
          provider = provider.replace(old_result, new_result, 1)

          helper_anchor = '''        /**
                   * 更新卡片标题
          '''
          helpers = '''        private fun isTransientFailure(data: WidgetData): Boolean {
                      if (data.isSuccess) return false
                      val message = listOfNotNull(data.statusText, data.errorMessage).joinToString(" ")
                      val transientKeywords = listOf(
                          "域名解析失败",
                          "网络错误",
                          "网络异常",
                          "连接失败",
                          "连接超时",
                          "请求过于频繁",
                          "服务器错误",
                          "服务器异常",
                          "获取失败"
                      )
                      return transientKeywords.any { message.contains(it) }
                  }
          
                  private fun persistWidgetData(context: Context, platformName: String, data: WidgetData) {
                      try {
                          val obj = org.json.JSONObject()
                              .put("platformName", data.platformName)
                              .put("isSuccess", true)
                              .put("isAvailable", true)
                          data.modelName?.let { obj.put("modelName", it) }
                          data.primaryMetric?.let { obj.put("primaryMetric", metricToJson(it)) }
                          obj.put("usageMetrics", metricsToJson(data.usageMetrics))
                          data.percentage?.let { obj.put("percentage", it) }
                          data.percentageLabel?.let { obj.put("percentageLabel", it) }
                          obj.put("auxiliaryMetrics", metricsToJson(data.auxiliaryMetrics))
                          data.statusText?.let { obj.put("statusText", it) }
                          data.displayLabel?.let { obj.put("displayLabel", it) }
                          data.total?.let { obj.put("total", it) }
                          data.used?.let { obj.put("used", it) }
                          data.remaining?.let { obj.put("remaining", it) }
                          data.callCount?.let { obj.put("callCount", it) }
                          data.usagePercent?.let { obj.put("usagePercent", it) }
                          context.getSharedPreferences(CACHE_PREFS_NAME, Context.MODE_PRIVATE)
                              .edit()
                              .putString(platformName, obj.toString())
                              .apply()
                      } catch (e: Exception) {
                          android.util.Log.w("BalanceWidgetProvider", "保存最近成功数据失败: $platformName", e)
                      }
                  }
          
                  private fun loadPersistedWidgetData(context: Context, platformName: String): WidgetData? {
                      val raw = context.getSharedPreferences(CACHE_PREFS_NAME, Context.MODE_PRIVATE)
                          .getString(platformName, null)
                          ?: return null
                      return try {
                          val obj = org.json.JSONObject(raw)
                          WidgetData(
                              platformName = platformName,
                              modelName = obj.optString("modelName", "").takeIf { it.isNotBlank() },
                              primaryMetric = obj.optJSONObject("primaryMetric")?.let { jsonToMetric(it) },
                              usageMetrics = jsonToMetrics(obj.optJSONArray("usageMetrics")),
                              percentage = if (obj.has("percentage")) obj.optInt("percentage") else null,
                              percentageLabel = obj.optString("percentageLabel", "").takeIf { it.isNotBlank() },
                              auxiliaryMetrics = jsonToMetrics(obj.optJSONArray("auxiliaryMetrics")),
                              statusText = obj.optString("statusText", "").takeIf { it.isNotBlank() },
                              isSuccess = true,
                              displayLabel = obj.optString("displayLabel", "").takeIf { it.isNotBlank() },
                              total = if (obj.has("total")) obj.optDouble("total") else null,
                              used = if (obj.has("used")) obj.optDouble("used") else null,
                              remaining = if (obj.has("remaining")) obj.optDouble("remaining") else null,
                              callCount = if (obj.has("callCount")) obj.optLong("callCount") else null,
                              usagePercent = if (obj.has("usagePercent")) obj.optInt("usagePercent") else null,
                              isAvailable = true,
                              errorMessage = null,
                              isFallback = false
                          )
                      } catch (e: Exception) {
                          android.util.Log.w("BalanceWidgetProvider", "读取最近成功数据失败: $platformName", e)
                          null
                      }
                  }
          
                  private fun metricToJson(metric: WidgetData.DisplayMetric): org.json.JSONObject {
                      return org.json.JSONObject()
                          .put("label", metric.label)
                          .put("value", metric.value)
                  }
          
                  private fun metricsToJson(metrics: List<WidgetData.DisplayMetric>): org.json.JSONArray {
                      val array = org.json.JSONArray()
                      metrics.forEach { array.put(metricToJson(it)) }
                      return array
                  }
          
                  private fun jsonToMetric(obj: org.json.JSONObject): WidgetData.DisplayMetric {
                      return WidgetData.DisplayMetric(
                          label = obj.optString("label", ""),
                          value = obj.optString("value", "")
                      )
                  }
          
                  private fun jsonToMetrics(array: org.json.JSONArray?): List<WidgetData.DisplayMetric> {
                      if (array == null) return emptyList()
                      val result = mutableListOf<WidgetData.DisplayMetric>()
                      for (i in 0 until array.length()) {
                          array.optJSONObject(i)?.let { result.add(jsonToMetric(it)) }
                      }
                      return result
                  }
          
          ''' + helper_anchor
          if helper_anchor not in provider:
              raise SystemExit('Provider helper insertion point not found')
          provider_path.write_text(provider.replace(helper_anchor, helpers, 1))

          layout_path = Path('app/src/main/res/layout/widget_balance.xml')
          layout = layout_path.read_text()
          for prefix in ('kimi', 'mimo', 'ds', 'oai'):
              pattern = re.compile(
                  rf'(\n\s*<TextView\n\s+android:id="@\+id/{prefix}_auxiliary"[\s\S]*?android:textColor="#FF8E8E93" />)',
                  re.MULTILINE,
              )
              match = pattern.search(layout)
              if not match:
                  raise SystemExit(f'Layout auxiliary block not found for {prefix}')
              marker = f'''\n\n            <TextView
                android:id="@+id/{prefix}_fallback"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:gravity="bottom|end"
                android:text=""
                android:textSize="12sp"
                android:visibility="gone" />'''
              layout = layout[:match.end()] + marker + layout[match.end():]
          layout_path.write_text(layout)
          PY

      - name: Build debug APK once
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Commit verified changes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/java/myapplication/adapter/WidgetData.kt \
                  app/src/main/java/com/java/myapplication/BalanceWidgetProvider.kt \
                  app/src/main/res/layout/widget_balance.xml
          git commit -m "Add persistent per-card fallback for transient network errors"
          git push origin HEAD:feature/persistent-widget-fallback
